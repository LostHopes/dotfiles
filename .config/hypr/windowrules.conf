##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

windowrule {
    # You can name the rule, but it is optional
    name = No anim + full opacity apps

    match:class = ^(vivaldi-stable|Vivaldi-stable|org.pwmt.zathura|obsidian|org.telegram.desktop|libreoffice*)$

    # Force 100% opacity for both Active AND Inactive states
    # format: opacity = active inactive
    opacity = 1.0 override

    # Disable window open/close animations for these windows
    no_anim = off
}

windowrule {
    name = Suppress maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = XWayland helper windows
    match:class = ^$
    match:xwayland = true

    float = on
    pin = on
    no_focus = on
    no_anim = on
    immediate = on
    opacity = 1.0 override
}

windowrule {
  name = Follow link
  match:class = ^($browser)$

  focus_on_activate = on
}

# =============================================
# UEBERZUGPP IMAGE PREVIEW RULES FOR RANGER
# =============================================
# These rules make ueberzugpp overlay windows behave correctly
# so image previews appear inside the terminal instead of new windows

windowrule {
    name = Ueberzugpp image preview overlay
    match:class = ^(ueberzugpp_.*)$

    float = on
    no_anim = on
    no_focus = on
    no_initial_focus = on
    no_shadow = on
    no_blur = on
    border_size = 0
    rounding = 0
    opacity = 1.0 override 1.0 override
    no_blur = on
}

# Alternative pattern matching for ueberzugpp (different naming conventions)
windowrule {
    name = Ueberzugpp alternative pattern
    match:class = ^(ueberzugpp)$

    float = on
    no_anim = on
    no_focus = on
    no_initial_focus = on
    no_shadow = on
    no_blur = on
    border_size = 0
    rounding = 0
    opacity = 1.0 override 1.0 override
}

# Match by title for ueberzugpp windows
windowrule {
    name = Ueberzugpp by title
    match:title = ^(ueberzug.*)$

    float = on
    no_anim = on
    no_focus = on
    no_initial_focus = on
    border_size = 0
    no_shadow = on
    no_blur = on
    rounding = 0
    opacity = 1.0 override 1.0 override
}

